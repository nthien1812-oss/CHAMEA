name: Test CHAMÉA AI RAG
on:
  push:
    paths: ["chamea-ai/**", ".github/workflows/chamea-ai-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check storefront JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/data.js
      - name: Syntax check and RAG tests
        working-directory: chamea-ai
        run: |
          npm run check
          npm test
