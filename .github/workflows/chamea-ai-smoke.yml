name: Smoke test public CHAMÉA Gemini chatbot
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/chamea-ai-smoke.yml"
permissions:
  contents: read
jobs:
  test-public-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify unauthenticated Production health and a real Gemini conversation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://chamea-ai.vercel.app/api/chat';
          const health=await fetch(base,{redirect:'manual'});
          console.log('Unauthenticated GET HTTP:',health.status);
          assert.equal(health.status,200,'Public API health must respond without Vercel login');
          const h=await health.json();
          assert.equal(h.status,'ready');
          assert.ok(h.catalogCount>=20);
          const origin='https://nthien1812-oss.github.io';
          const response=await fetch(base,{
            method:'POST',
            redirect:'manual',
            headers:{'Origin':origin,'Content-Type':'application/json'},
            body:JSON.stringify({
              message:'Mình đang tìm túi màu hồng, ngân sách khoảng 800k, bạn gợi ý mẫu nào?',
              history:[]
            })
          });
          console.log('Public Gemini POST HTTP:',response.status);
          assert.equal(response.headers.get('access-control-allow-origin'),origin);
          const reply=await response.json();
          if(!response.ok)console.log('Safe API error code:',reply.error||'unknown');
          assert.equal(response.status,200);
          assert.ok(typeof reply.reply==='string'&&reply.reply.length>25,'Real Gemini text is required');
          assert.ok(Array.isArray(reply.products));
          console.log('Gemini reply received, characters:',reply.reply.length,'products:',reply.products.length);
          const ask=async(message,history)=>{
            const r=await fetch(base,{method:'POST',redirect:'manual',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({message,history})});
            const value=await r.json();
            console.log('Gift consultation HTTP:',r.status,'needsMoreInfo:',Boolean(value.needsMoreInfo));
            if(!r.ok)console.log('Safe API error:',value.error||'unknown');
            assert.equal(r.status,200);
            assert.equal(r.headers.get('access-control-allow-origin'),origin);
            return value;
          };
          const first=await ask('t muốn mua túi tặng mẹ',[]);
          assert.match(first.reply,/mẹ/i);
          assert.match(first.reply,/bao nhiêu|ngân sách/i);
          assert.equal(first.products.length,0);
          const history=[{role:'user',content:'t muốn mua túi tặng mẹ'},{role:'model',content:first.reply}];
          const second=await ask('dưới 800k',history);
          assert.match(second.reply,/phong cách|thích/i);
          history.push({role:'user',content:'dưới 800k'},{role:'model',content:second.reply});
          const third=await ask('mẹ thích thanh lịch',history);
          assert.ok(third.reply.length>25);
          console.log('Gift flow passed; final reply characters:',third.reply.length,'products:',third.products.length);
          const teacher=await ask('Mình muốn mua túi tặng cô giáo',[]);
          assert.match(teacher.reply,/cô giáo/i);
          assert.match(teacher.reply,/bao nhiêu|ngân sách/i);
          assert.doesNotMatch(teacher.reply,/tặng ai|cho ai/i);
          const teacherHistory=[{role:'user',content:'Mình muốn mua túi tặng cô giáo'},{role:'model',content:teacher.reply}];
          const next=await ask('dưới 800k',teacherHistory);
          assert.match(next.reply,/cô giáo/i);
          assert.doesNotMatch(next.reply,/tặng ai|cho ai/i);
          teacherHistory.push({role:'user',content:'dưới 800k'},{role:'model',content:next.reply});
          const recommendation=await ask('cô ấy thích thanh lịch',teacherHistory);
          assert.equal(typeof recommendation.reply,'string');
          assert.ok(recommendation.reply.length>20);
          assert.doesNotMatch(recommendation.reply,/tặng ai|cho ai/i);
          console.log('Teacher gift flow passed:',teacher.reply.length,next.reply.length,recommendation.reply.length);
          const limitedBudgetHistory=[{role:'user',content:'Mình muốn mua túi tặng cô giáo'},{role:'model',content:teacher.reply}];
          const politeBudget=await ask('500',limitedBudgetHistory);
          assert.match(politeBudget.reply,/500\.000đ/i);
          assert.match(politeBudget.reply,/chưa có thiết kế/i);
          assert.doesNotMatch(politeBudget.reply,/đã có thể lọc|lọc túi|ban hay hoi ve|người bạn muốn tặng/i);
          assert.equal(politeBudget.products.length,0);
          console.log('Polished 500k reply passed:',politeBudget.reply.length);
          const interrupted=[{role:'user',content:'t muốn mua túi tặng mẹ'},{role:'model',content:first.reply}];
          const greeting=await ask('CHÀO',interrupted);
          assert.match(greeting.reply,/chào/i);
          assert.doesNotMatch(greeting.reply,/ngân sách|bao nhiêu|dành khoảng/i);
          assert.notEqual(greeting.reply,first.reply);
          assert.deepEqual(greeting.products,[]);
          const secondGreeting=await ask('Xin chào shop',[...interrupted,{role:'user',content:'CHÀO'},{role:'model',content:greeting.reply}]);
          assert.match(secondGreeting.reply,/CHAMÉA|chào/i);
          assert.notEqual(secondGreeting.reply,greeting.reply);
          const thanked=await ask('Cảm ơn',interrupted);
          assert.doesNotMatch(thanked.reply,/ngân sách|bao nhiêu/i);
          const changedTopic=await ask('Mẫu Nina làm bằng chất liệu gì?',interrupted);
          assert.ok(changedTopic.reply.length>25);
          assert.notEqual(changedTopic.reply,first.reply);
          console.log('Greeting and changed-topic smoke test passed.');
          NODE
